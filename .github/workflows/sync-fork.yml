name: 🔄 Sync Fork

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 时间 2 点执行（中国时间上午 10 点）
  workflow_dispatch:     # 也允许你手动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout your forked repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: 🔧 Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Add upstream & fetch changes
        run: |
          git remote add upstream https://github.com/CampSmart/CampSmart.git
          git fetch upstream
          git checkout main
          git merge upstream/main || echo "Already up to date"

      - name: 🚀 Push changes back to your fork
        run: |
          git push origin main
